name: navo
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: navo
      POSTGRES_PASSWORD: navo
      POSTGRES_DB: navo
    ports:
      - "54322:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U navo -d navo"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - navo-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - navo-redis:/data

volumes:
  navo-postgres:
  navo-redis:

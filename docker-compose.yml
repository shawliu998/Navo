name: exportplay
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: exportplay
      POSTGRES_PASSWORD: exportplay
      POSTGRES_DB: exportplay
    ports:
      - "54322:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exportplay -d exportplay"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - exportplay-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - exportplay-redis:/data

volumes:
  exportplay-postgres:
  exportplay-redis:
